name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat <<EOF > .env
          # Base site URL used for sitemap and robots
          BASE_URL=${{ secrets.BASE_URL }}

          # FTP credentials for scripts/ftp-sync-pages.js
          FTP_HOST=${{ secrets.FTP_HOST }}
          FTP_USER=${{ secrets.FTP_USERNAME }}
          FTP_PASS=${{ secrets.FTP_PASSWORD }}
          FTP_PORT=${{ secrets.FTP_PORT }}
          FTP_SECURE=${{ secrets.FTP_SECURE }}
          # Remote directory that contains your site pages folder
          FTP_REMOTE_PAGES_DIR=${{ secrets.FTP_REMOTE_PAGES_DIR }}
          EOF

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/scripts/**
            **/pages/post_format.html
