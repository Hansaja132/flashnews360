name: Scheduled Sync and Deploy

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create .env from secrets
        run: |
          cat <<EOF > .env
          # Base site URL used for sitemap and robots
          BASE_URL=${{ secrets.BASE_URL }}

          # Optional path prefix for post URLs in the sitemap
          POST_PATH=${{ secrets.POST_PATH }}

          # Database connection for post.php (Supabase/PostgreSQL)
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_SSL=${{ secrets.DB_SSL }}
          EOF

      - name: Install sitemap dependency
        run: npm install pg

      - name: Build sitemap
        run: node scripts/build-sitemap.js


      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            /.git*
            **/.github/**
            **/node_modules/**
            **/.vscode/**
            **/scripts/**
            **/pages/post_format.html
